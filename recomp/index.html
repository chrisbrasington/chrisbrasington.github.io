"platform":["GC"],"target":["PC"],"notes":"Allows extraction of uncompressed audio from dreamcast version for usage in gamecube game. Allows minor un-censorship using Japanese dreamcast version.","cover":"img/skies-of-arcadia.jpg","urls":["https://github.com/ogdanimal/SkiesOfArcadiaLegends-Recomp/releases"]},{"title":"Super Mario 64","year":"1996","status":"Released","hq":true,"platform":["N64"],"target":["3DS"],"notes":"Supports 3D","cover":"img/super-mario-64.png","urls":["https://github.com/Splashy527/sm64-port"]},{"title":"The Elder Scrolls III: Morrowind (openMW - Tamriel Rebuild)","year":"2002","status":"Released","hq":true,"platform":["PC"],"target":["PC"],"notes":"OpenMW is a total engine rewrite and the preferred way to play.","cover":"img/the-elder-scrolls-iii-morrowind-openmw-tamriel-rebuild.jpg","urls":["https://openmw.org/","https://www.tamriel-rebuilt.org/","https://openmw-vr.readthedocs.io/en/latest/manuals/installation/install-openmw-vr.html"]},{"title":"The Last Guardian","year":"2016","status":"Released","hq":false,"platform":["PS4"],"target":["PC"],"notes":"","cover":"img/the-last-guardian.jpg","urls":["https://github.com/HayatoG/tlg_pc/releases"]},{"title":"The Legend of Zelda: A Link to the Past","year":"","status":"Released","hq":false,"platform":["SNES"],"target":["3DS","PC"],"notes":"Supports dual screen","cover":"img/the-legend-of-zelda-a-link-to-the-past.jpg","urls":["https://github.com/EstebanPdN/zelda-alttp-3ds/releases"]},{"title":"The Legend of Zelda: Link's Awakening","year":"2019","status":"Released","hq":false,"platform":["SWITCH"],"target":["PC"],"notes":"","cover":"img/the-legend-of-zelda-link-s-awakening.png","urls":["https://github.com/peiikai/LASRecomp/releases"]},{"title":"The Legend of Zelda: Link's Awakening DX","year":"1993","status":"Released","hq":false,"platform":["GB"],"target":["PC"],"notes":"Full remake","cover":"img/the-legend-of-zelda-link-s-awakening-dx.jpg","urls":["https://archive.org/details/links-awakening-dx-hd -Complete"]}]</script>
<script>(function webScript() {
    const games = JSON.parse(document.getElementById("recomp-data").textContent);
    const STATUS = {
        "Released": { cls: "", badge: null },
        "In Progress": { cls: "wip", badge: "IN PROGRESS" },
        "Unverified": { cls: "unverified", badge: "UNVERIFIED" },
    };
    const statusOrder = Object.keys(STATUS);
    const getters = { status: g => g.status, quality: g => g.hq ? "★ High Quality" : "Standard", platform: g => g.platform, target: g => g.target };
    const filters = { status: null, quality: null, platform: null, target: null };

    function el(parent, tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text) node.textContent = text;
        parent.appendChild(node);
        return node;
    }
    function countBy(fn) {
        const counts = {};
        games.forEach(g => [fn(g)].flat().forEach(k => counts[k] = (counts[k] ?? 0) + 1));
        return Object.entries(counts).sort((a, b) => a[0].localeCompare(b[0]));
    }
    function linkLabel(url) {
        try {
            const u = new URL(url);
            const parts = u.pathname.split("/").filter(Boolean);
            if (u.hostname.endsWith("github.com") && parts.length >= 2) return parts[1];
            return u.hostname.replace(/^www\./, "");
        } catch { return url; }
    }

    const header = document.getElementById("recomp-filters");
    const pills = [];
    function filterRow(label, key, entries, fmt) {
        const row = el(header, "div", "recomp-stats");
        el(row, "span", "recomp-stat-label", label);
        const all = el(row, "span", "recomp-stat active", `All ${games.length}`);
        pills.push({ node: all, key, value: null });
        all.onclick = () => setFilter(key, null);
        entries.forEach(([value, n]) => {
            const pill = el(row, "span", "recomp-stat", `${fmt(value)} ${n}`);
            pills.push({ node: pill, key, value });
            pill.onclick = () => setFilter(key, filters[key] === value ? null : value);
        });
    }
    function setFilter(key, value) {
        filters[key] = value;
        pills.forEach(p => p.node.classList.toggle("active", filters[p.key] === p.value));
        renderBody();
    }
    filterRow("Status", "status", countBy(getters.status).sort((a, b) => statusOrder.indexOf(a[0]) - statusOrder.indexOf(b[0])), v => v);
    filterRow("Quality", "quality", countBy(getters.quality).filter(([v]) => v !== "Standard"), v => v);
    filterRow("Console", "platform", countBy(getters.platform), v => v);
    filterRow("Target", "target", countBy(getters.target), v => `→ ${v}`);

    function renderCard(grid, g) {
        const { cls, badge } = STATUS[g.status];
        const card = el(grid, "div", `recomp-card ${cls}`);
        if (g.cover) {
            const cover = el(card, g.urls.length ? "a" : "div", "recomp-cover");
            if (g.urls.length) {
                cover.href = g.urls[0];
                cover.target = "_blank";
                cover.rel = "noopener";
                cover.title = g.urls[0];
            }
            const img = el(cover, "img");
            img.src = g.cover;
            img.alt = g.title;
            img.loading = "lazy";
            if (g.hq) el(cover, "span", "recomp-star", "★").title = "High quality recomp";
            if (badge) el(cover, "span", `recomp-wip-badge ${cls}`, badge);
        }
        const titleRow = el(card, "div", "recomp-title");
        if (!g.cover && g.hq) el(titleRow, "span", "recomp-title-star", "★");
        el(titleRow, "a", null, g.title);
        if (g.year) el(card, "div", "recomp-year", g.year);
        const port = el(card, "div", "recomp-port");
        g.platform.forEach(p => el(port, "span", "recomp-chip from", p));
        el(port, "span", "recomp-arrow", "→");
        g.target.forEach(t => el(port, "span", "recomp-chip to", t));
        el(card, "div", "recomp-notes", g.notes);
        const links = el(card, "div", "recomp-links");
        g.urls.forEach(url => {
            const link = el(links, "a", "recomp-link", g.urls.length > 1 ? `⧉ ${linkLabel(url)}` : "⧉ Recomp Project");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener";
            link.title = url;
        });
    }

    const body = document.getElementById("recomp-body");
    function renderBody() {
        body.innerHTML = "";
        const shown = games.filter(g => Object.keys(filters).every(k => filters[k] === null || [getters[k](g)].flat().includes(filters[k])));
        if (!shown.length) { el(body, "div", "recomp-empty", "No games match these filters."); return; }
        statusOrder.forEach(status => {
            const list = shown.filter(g => g.status === status);
            if (!list.length) return;
            el(body, "div", `recomp-section-title ${STATUS[status].cls}`, status);
            const grid = el(body, "div", "recomp-grid");
            list.forEach(g => renderCard(grid, g));
        });
    }
    renderBody();
})();</script>
